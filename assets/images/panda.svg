<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Zoogar Panda master artwork. Export as a 600x600 transparent PNG for the app. -->

  <!-- Ears: drawn first so the face (and its outline) overlaps them. -->
  <circle cx="156" cy="120" r="96" fill="#1C2B22" />
  <circle cx="444" cy="120" r="96" fill="#1C2B22" />

  <!-- Face: 88% of the canvas including the outline, sitting slightly low. -->
  <circle cx="300" cy="312" r="255" fill="#FFFFFF" stroke="#D5E0D9" stroke-width="18" />

  <!-- Eye patches. -->
  <ellipse cx="204" cy="280" rx="66" ry="78" fill="#1C2B22" />
  <ellipse cx="396" cy="280" rx="66" ry="78" fill="#1C2B22" />

  <!-- Pupils: nudged slightly up and inward. -->
  <circle cx="216" cy="266" r="24" fill="#FFFFFF" />
  <circle cx="384" cy="266" r="24" fill="#FFFFFF" />

  <!-- Nose. -->
  <ellipse cx="300" cy="420" rx="36" ry="26" fill="#1C2B22" />
</svg>
